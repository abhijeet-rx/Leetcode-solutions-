name: Update README Stats

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update solution counts
        shell: bash
        run: |
          easy=$(find leetcode/Easy -type f | wc -l)
          medium=$(find leetcode/Medium -type f | wc -l)
          hard=$(find leetcode/Hard -type f | wc -l)
          leetcode=$((easy + medium + hard))
          gfg=$(find geeksforgeeks/Practice -type f | wc -l)
          combined=$((leetcode + gfg))

          python3 - <<PY
          from pathlib import Path
          import re

          p = Path("README.md")
          s = p.read_text()

          s = re.sub(
              r"\| 🟡 LeetCode \|.*?\|.*?\|.*?\|.*?\|",
              f"| 🟡 LeetCode | **{easy}** | **{medium}** | **{hard}** | **{leetcode}** |",
              s,
              count=1,
          )
          s = re.sub(
              r"\| 🟢 GeeksForGeeks \|.*?\|",
              f"| 🟢 GeeksForGeeks | — | — | — | **{gfg}** |",
              s,
              count=1,
          )
          s = re.sub(
              r"\| \*\*Combined\*\* \|.*?\| \*\*\d+\*\* \|",
              f"| **Combined** | | | | | **{combined}** |",
              s,
              count=1,
          )

          s = re.sub(
              r"🔥 \*\*\d+ solutions\*\* and counting",
              f"🔥 **{combined} solutions** and counting",
              s,
              count=1,
          )

          p.write_text(s)
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update DSA solution stats"
          git push
