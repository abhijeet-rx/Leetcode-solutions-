name: Update README Stats

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update solution counts
        shell: bash
        run: |
          easy=$(find leetcode/Easy -type f | wc -l)
          medium=$(find leetcode/Medium -type f | wc -l)
          hard=$(find leetcode/Hard -type f | wc -l)
          leetcode=$((easy + medium + hard))
          gfg=$(find geeksforgeeks/Practice -type f | wc -l)
          combined=$((leetcode + gfg))

          python3 - <<PY
          from pathlib import Path
          p = Path("README.md")
          s = p.read_text()
          replacements = {
              "<!-- LC_EASY -->": str($easy),
              "<!-- LC_MEDIUM -->": str($medium),
              "<!-- LC_HARD -->": str($hard),
              "<!-- LC_TOTAL -->": str($leetcode),
              "<!-- GFG_TOTAL -->": str($gfg),
              "<!-- COMBINED_TOTAL -->": str($combined),
          }
          for marker, value in replacements.items():
              s = s.replace(marker, value)
          p.write_text(s)
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update DSA solution stats"
          git push
