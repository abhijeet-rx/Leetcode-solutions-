name: Update README Stats

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Count total solved questions
        shell: bash
        run: |
          leetcode_total=0
          if [ -d "leetcode" ]; then
            leetcode_total=$(find leetcode -type f \( -iname "*.java" -o -iname "*.cpp" -o -iname "*.py" -o -iname "*.js" \) | wc -l)
          fi

          gfg_total=0
          if [ -d "geeksforgeeks" ]; then
            gfg_total=$(find geeksforgeeks -type f \( -iname "*.java" -o -iname "*.cpp" -o -iname "*.py" -o -iname "*.js" \) | wc -l)
          fi

          combined=$((leetcode_total + gfg_total))

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("README.md")
          text = p.read_text()

          start = "<!--START_TOTALS-->"
          end = "<!--END_TOTALS-->"

          pattern = rf"{re.escape(start)}.*?{re.escape(end)}"
          replacement = f"""{start}
| Platform | Total Solutions |
|----------|-----------------|
| 🟡 LeetCode | **{leetcode_total}** |
| 🟢 GeeksForGeeks | **{gfg_total}** |
| **Combined** | **{combined}** |
{end}"""

          text = re.sub(pattern, replacement, text, flags=re.S, count=1)

          text = re.sub(
              r"🔥 \*\*\d+ solutions\*\* and counting",
              f"🔥 **{combined} solutions** and counting",
              text,
              count=1,
          )

          p.write_text(text)
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update total solution count"
          git push
